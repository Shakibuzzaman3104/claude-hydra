name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest ruff
      - run: ruff check bin tests/python
      - run: python -m pytest tests/python -q

  plugin:
    name: plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @anthropic-ai/claude-code@2.1.300
      # Both commands work offline with no login or config (verified with an empty environment and a fresh HOME).
      - name: Validate the plugin
        run: claude plugin validate .
      - name: Run the hooks tests (hooks/register.test.ts)
        run: claude plugin test .
      # There is deliberately no `tsc --noEmit -p .` step: tsconfig.json extends .claude-plugin/types/tsconfig.json, and that folder
      # (the SDK types, gitignored) is generated only when the engine loads the mod in a session, which needs a logged-in Claude Code.
      # `claude plugin validate` and `claude plugin test` do not write it, so a fresh clone cannot be type-checked in CI. Run
      # `npx -p typescript tsc -p . --noEmit` locally from a loaded copy instead (see DEVELOPING.md).

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck examples/statusline.sh
